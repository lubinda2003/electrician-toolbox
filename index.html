<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Electrician Toolbox — Fast electrical calculations</title>
    <meta
      name="description"
      content="Fast, offline-capable electrical calculators for electricians and technicians: Ohm's Law, power, voltage drop, generator load, and unit conversion. No account, no ads, no AI."
    />
    <link rel="canonical" href="https://electrician-toolbox.example.com/" />

    <meta name="theme-color" content="#d97706" />
    <meta name="color-scheme" content="light dark" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icons/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />

    <meta property="og:title" content="Electrician Toolbox — Fast electrical calculations" />
    <meta
      property="og:description"
      content="Fast, offline-capable electrical calculators: Ohm's Law, power, voltage drop, generator load, unit conversion."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://electrician-toolbox.example.com/" />
    <meta name="twitter:card" content="summary" />

    <script>
      // Apply saved theme before paint to avoid a light/dark flash.
      try {
        var t = JSON.parse(localStorage.getItem("et_theme_v1") || '"system"');
        var isDark = t === "dark" || (t === "system" && window.matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.dataset.theme = isDark ? "dark" : "light";
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
